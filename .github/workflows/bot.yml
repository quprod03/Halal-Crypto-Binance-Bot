name: Run Halal Crypto Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Remove any existing python-telegram-bot
      run: pip uninstall -y python-telegram-bot

    - name: Install dependencies (force exact versions)
      run: pip install --no-cache-dir -r requirements.txt

    - name: Verify telegram version
      run: python -c "import telegram; print('python-telegram-bot version:', telegram.__version__)"

    - name: Run bot
      env:
        OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
        OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
        OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python main.py
