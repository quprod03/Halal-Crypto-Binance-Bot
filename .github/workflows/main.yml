jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Remove any existing python-telegram-bot
      run: pip uninstall -y python-telegram-bot

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Verify telegram version
      run: python -c "import telegram; print('python-telegram-bot version:', telegram.__version__)"

    - name: Run bot
      run: python main.py
